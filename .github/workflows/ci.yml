name: CI

# Format and type check, tests and build: the same `pnpm run ready` you run locally.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ready:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4 # same as devEngines.packageManager in package.json
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Check, test and build
        run: pnpm run ready
