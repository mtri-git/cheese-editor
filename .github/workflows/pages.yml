name: Playground

# Builds the playground (apps/playground) and publishes it to GitHub Pages:
# https://mtri-git.github.io/cheese-editor/
#
# One-time setup: repository Settings > Pages > Build and deployment > Source: "GitHub Actions".
on:
  push:
    branches: [main]
    paths:
      - apps/playground/**
      - packages/editor/**
      - pnpm-lock.yaml
      - .github/workflows/pages.yml
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.4 # same as devEngines.packageManager in package.json
          cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install
        run: pnpm install --frozen-lockfile

      # The playground imports the editor from source (see its vite.config.ts), so the editor is not
      # built first. BASE_PATH makes asset URLs start with /cheese-editor/.
      - name: Build the playground
        run: pnpm --filter playground build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/

      - uses: actions/configure-pages@v6

      - uses: actions/upload-pages-artifact@v5
        with:
          path: apps/playground/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
